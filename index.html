<!DOCTYPE html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="UTF-8" />
    <base href="https://innmoe.vicp.fun/resource/" />
    <link rel="preconnect" href="https://innmoe.vicp.fun" />
    <link rel="dns-prefetch" href="https://innmoe.vicp.fun" />
    <link rel="preconnect" href="https://music.163.com" />
    <link rel="dns-prefetch" href="https://music.163.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="主页" />
    <meta name="keywords" content="主页" />
    <link rel="shortcut icon" href="home/img/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="home/img/favicon.ico" type="image/x-icon" />
    <link href="home/css/metro-all.css" rel="stylesheet" />
    <link href="home/tiles/start.css" rel="stylesheet" />
    <link href="home/desktop/descktop.css" rel="stylesheet" />
    <title>主页 - inn.moe</title>
    <style>
      #charm {
        height: calc(100vh - 40px);
        width: 396px;
        background-color: #1f4f5d;
      }
    </style>
  </head>

  <body class="bg-dark fg-white h-vh-100 m4-cloak">
    <div data-role="charms" data-position="right" id="charm" class="p-4">
      <div class="h-100 d-flex flex-column">
        <div class="charm-top">
          <div class="text-center m-4">
            <span>通知</span>
          </div>
          <div class="charm-notify">
            <span class="icon mif-info"></span>
            <div class="title">User-Agent</div>
            <div class="content">
              <td>
                <script language="JavaScript" type="text/javascript">
                  document.write(navigator.userAgent);
                </script>
              </td>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="desktop">
      <div class="window-area">
        <div class="container-fluid start-screen h-100" style="overflow-y: auto; overflow-x: hidden">
          <h1 class="start-screen-title">开始</h1>
          <div class="tiles-area clear">
            <div class="tiles-grid tiles-group size-2 fg-white" data-group-title="General">
              <a href="https://blog.inn.moe" data-role="tile" class="bg-indigo fg-white">
                <span class="mif-ie icon"></span>
                <span class="branding-bar">Blog</span>
              </a>
              <a href="https://mail.inn.moe" data-role="tile" class="bg-blue fg-white">
                <span class="mif-mail icon"></span>
                <span class="branding-bar">Email</span>
              </a>
              <a onmouseup="createWindowCalendar()" data-role="tile" class="bg-taupe fg-white">
                <span class="mif-table icon"></span>
                <span class="branding-bar">日历</span>
              </a>
              <a href="https://innmoe.vicp.fun" data-role="tile" class="bg-teal fg-white">
                <span class="mif-cabinet icon"></span>
                <span class="branding-bar">文件库</span>
              </a>
              <div data-role="tile" data-size="wide" class="bg-red fg-white">
                <iframe
                  title="网易云音乐播放器"
                  width="310"
                  height="110"
                  loading="lazy"
                  style="border: 0; margin: 0"
                  src="https://music.163.com/outchain/player?type=0&id=8886033113&auto=0&height=90"
                ></iframe>
                <span class="branding-bar">网易云音乐</span>
              </div>
            </div>

            <div class="tiles-grid tiles-group size-1 fg-white" data-group-title="Office">
              <a href="https://outlook.live.com/" data-role="tile" data-size="small">
                <img src="home/img/outlook.png" class="icon" loading="lazy" decoding="async" />
              </a>
              <a href="https://www.office.com/launch/word" data-role="tile" data-size="small" class="bg-lightCobalt">
                <img src="home/img/word.png" class="icon" loading="lazy" decoding="async" />
              </a>
              <a href="https://www.office.com/launch/excel" data-role="tile" data-size="small" class="bg-emerald">
                <img src="home/img/excel.png" class="icon" loading="lazy" decoding="async" />
              </a>
              <a href="https://www.office.com/launch/powerpoint" data-role="tile" data-size="small" class="bg-red">
                <img src="home/img/powerpoint.png" class="icon" loading="lazy" decoding="async" />
              </a>
              <a href="https://www.onenote.com" data-role="tile" data-size="small" class="bg-violet">
                <img src="home/img/onenote.png" class="icon" loading="lazy" decoding="async" />
              </a>
              <a href="https://onedrive.live.com" data-role="tile" data-size="small" class="bg-blue fg-white">
                <span class="mif-onedrive icon"></span>
              </a>
            </div>

            <div class="tiles-grid tiles-group size-2 fg-white" data-group-title="Social">
              <a href="https://discord.gg/KrRdmCkyyd" data-role="tile" class="bg-lightCobalt">
                <img src="home/img/discord.ico" class="icon" loading="lazy" decoding="async" />
                <span class="branding-bar">Discord</span>
              </a>
              <a href="https://steamcommunity.com/id/Flameu_Nop/" data-role="tile" class="bg-grayBlue fg-white">
                <span class="mif-steam icon"></span>
                <span class="branding-bar">Steam</span>
              </a>
            </div>

            <div class="tiles-grid tiles-group size-2 fg-white" data-group-title="Games">
              <a href="https://jp.finalfantasyxiv.com/lodestone/character/23726104/" data-role="tile" class="bg-brown">
                <img src="home/img/ff.ico" class="icon" loading="lazy" decoding="async" />
                <span class="branding-bar">Final Fantasy XIV</span>
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="task-bar">
        <div class="task-bar-section">
          <a href="mailto:i@inn.moe" class="task-bar-item" id="start-menu-toggle"><span class="mif-contacts-dialer"></span></a>
        </div>

        <div class="task-bar-section system-tray ml-auto">
          <span style="line-height: 40px" class="pr-4">
            <span data-role="clock" class="w-auto fg-white reduce-1" data-show-date="false"></span>
          </span>
          <button class="task-bar-item" id="open-charm" onclick="openCharm()"><span class="mif-comment"></span></button>
        </div>
      </div>
    </div>

    <script src="jquery/3.3.1/jquery.min.js" defer></script>
    <script src="home/js/metro.js" defer></script>
    <script src="home/tiles/start.js" defer></script>
    <script src="home/desktop/desktop.js" defer></script>
  </body>
</html>
